<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Python Head On</title>
  <style>
    /* Python snake skin theme: Black base for shadowy depths, dark green for scaly patterns, silver for iridescent sheen */
    :root {
      --bg: #000000; /* Black - dark underbelly */
      --header-bg: #001a00; /* Darker green-tinged black */
      --code-bg: #002200; /* Subtle green undertone for code area */
      --text: #C0C0C0; /* Silver - metallic text for readability */
      --comment: #228B22; /* Forest green - for comments, evoking snake scales */
      --hint: #A9A9A9; /* Dark silver - subtle hints */
      --accent: #006400; /* Dark green - accents and highlights */
      --btn: #228B22; /* Green - button base */
      --btn-hover: #32CD32; /* Lime green - hover for energy */
      --border: #C0C0C0; /* Silver - borders with metallic edge */
      --shine: #D3D3D3; /* Light silver - shine effects */
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Courier New', monospace;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--header-bg);
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 4px solid var(--border);
      position: relative;
      z-index: 10;
    }
    h1 { font-size: 22px; color: var(--shine); text-shadow: 0 0 10px var(--accent); }
    #chapter-btn {
      background: var(--btn);
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
    }
    #chapter-btn:hover { background: var(--btn-hover); }
    #chapter-list {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      background: var(--header-bg);
      border: 3px solid var(--border);
      border-radius: 10px;
      max-height: 65vh;
      overflow-y: auto;
      width: 340px;
      display: none;
      z-index: 1000;
      box-shadow: 0 15px 30px rgba(0,0,0,0.8);
    }
    #chapter-list.show { display: block; }
    .chapter-item {
      padding: 16px 20px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      font-size: 16px;
      color: var(--shine);
    }
    .chapter-item:hover { background: #003300; } /* Dark green hover */
    #main { flex: 1; display: flex; flex-direction: column; }
    #code-area {
      flex: 1;
      background: var(--code-bg);
      padding: 20px 30px;
      overflow-y: auto;
      line-height: 1.5;
      font-size: 16px;
      white-space: pre;
      border-bottom: 4px solid var(--border);
    }
    .line { display: block; padding: 1px 0; color: var(--text); }
    .line.new { animation: addLine 0.8s ease-out; }
    .line.action-shine { background: #003300; animation: actionGlow 1s ease-in-out; }
    .line.line-shine { background: #004400; animation: lineGlow 1.8s ease-in-out; box-shadow: 0 0 40px var(--shine); }
    @keyframes addLine { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
    @keyframes actionGlow { 0%,100% { background: var(--code-bg); } 50% { background: #004400; } }
    @keyframes lineGlow { 0%,100% { background: var(--code-bg); } 50% { background: #006600; box-shadow: 0 0 60px var(--shine); } }
    #comment-box {
      background: var(--header-bg);
      color: var(--comment);
      padding: 25px 30px;
      font-size: 19px;
      border-top: 4px solid var(--border);
      min-height: 110px;
      line-height: 1.7;
    }
    #hint-area {
      background: var(--bg);
      padding: 16px 25px;
      font-size: 17px;
      color: var(--shine);
      font-weight: bold;
      border-top: 4px solid var(--border);
    }
    #input-area {
      background: var(--header-bg);
      padding: 20px 25px;
      border-top: 4px solid var(--border);
      display: flex;
      gap: 15px;
      align-items: center;
    }
    #code-input {
      flex: 1;
      background: var(--bg);
      color: var(--text);
      border: 4px solid var(--border);
      padding: 16px;
      font-family: 'Courier New', monospace;
      font-size: 19px;
      border-radius: 10px;
    }
    #code-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 25px var(--accent); }
    #code-input::placeholder { color: var(--comment); opacity: 1; transition: opacity 0.6s ease; }
    #code-input.fade::placeholder { opacity: 0; }
    #submit-btn, #skip-btn {
      border: none;
      padding: 16px 25px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 17px;
      box-shadow: 0 5px 12px rgba(0,0,0,0.7);
    }
    #submit-btn { background: var(--btn); color: #fff; }
    #submit-btn:hover { background: var(--btn-hover); }
    #skip-btn { background: #ff6b35; color: white; } /* Kept original for contrast, but can adjust */
    #skip-btn:hover { background: #ff4500; }
    #controls {
      background: var(--bg);
      padding: 16px;
      display: flex;
      justify-content: center;
      gap: 18px;
      border-top: 4px solid var(--border);
    }
    button {
      background: var(--btn);
      color: #fff;
      border: none;
      padding: 14px 25px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      box-shadow: 0 5px 12px rgba(0,0,0,0.7);
    }
    button:hover:not(:disabled) { background: var(--btn-hover); }
    button:disabled { background: #444; cursor: not-allowed; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }
    #code-input.action-shine {
      animation: shake 1s ease-in-out;
    }
  </style>
</head>
<body>
  <header>
    <h1>Python Head On</h1>
    <div id="chapter-selector">
      <button id="chapter-btn">Select Chapter</button>
      <div id="chapter-list"></div>
    </div>
  </header>
  <div id="main">
    <div id="code-area"></div>
    <div id="comment-box"></div>
    <div id="hint-area">Type exactly:</div>
    <div id="input-area">
      <input type="text" id="code-input" autocomplete="off" />
      <button id="submit-btn">Submit</button>
      <button id="skip-btn">Skip</button>
    </div>
    <div id="controls">
      <button id="prev">Previous</button>
      <button id="next">Next</button>
      <button id="reset">Reset</button>
    </div>
  </div>
  <script>

      {
        "title": "CHAPTER 1.2: Understanding print() Arguments and Commas",
        "steps": [
          { "comment": "# Function definition — Creates a reusable block to demonstrate print behavior.", "code": "def demonstrate_print_arguments():" },
          { "comment": "# Basic print — The parentheses () are part of the function call syntax.", "code": " print('Hello world!')" },
          { "comment": "# Inside the parentheses, 'Hello world!' is an argument — data passed into the function.", "code": " # Output: Hello world!" },
          { "comment": "# Multiple arguments — You can separate values with commas inside the parentheses.", "code": " print('My favorite colors are', 'blue', 'green', 'red')" },
          { "comment": "# How commas work — In Python's print(), each comma means 'separate these arguments'.", "code": " # Output: My favorite colors are blue green red" },
          { "comment": "# Why spaces appear — print() automatically inserts a single space between arguments.", "code": " # This is built-in behavior: commas don't literally mean space, but print() adds them." },
          { "comment": "# Parentheses role — They define the boundary of the function call and hold arguments.", "code": " # Arguments are the values inside (), telling print() what to display." },
          { "comment": "# Example with numbers — Multiple arguments can be of different types.", "code": " print('The answer is', 42)" },
          { "comment": "# Output shows automatic spacing between string and integer.", "code": " # Output: The answer is 42" },
          { "comment": "# Comparison with C++ — Instead of commas, C++ uses the << operator with cout.", "code": " # Example: cout << \"My favorite colors are \" << \"blue\" << \"green\" << \"red\";" },
          { "comment": "# Difference — In C++, << directly chains values together without automatic spaces, so you must add them manually.", "code": " # Python's print() is simpler for beginners because commas automatically insert spaces." },
          { "comment": "# Final note — Commas separate arguments, parentheses group them, and print() handles spacing.", "code": " # This makes print flexible for combining text and data." }
        ]
      },
      {
        "title": "CHAPTER 1.3: Python Data Types and Dynamic Typing",
        "steps": [
          { "comment": "# Function definition — Creates a reusable block to demonstrate Python data types.", "code": "def demonstrate_data_types():" },

          { "comment": "# Integer variable — Whole number, Python knows it's an int.", "code": " age = 25" },
          { "comment": "# Print values — Shows Python automatically recognizes types.", "code": " print('Name:', name)" },
          { "comment": "# Print values — Demonstrates integer output.", "code": " print('Age:', age)" },
          { "comment": "# Integer type — Whole numbers without decimals.", "code": " my_integer_var = 10" },
          { "comment": "# Print integer value.", "code": " print('Integer:', my_integer_var)" },
          { "comment": "# Float type — Numbers with decimals.", "code": " my_float_var = 4.50" },
          { "comment": "# Print float value.", "code": " print('Float:', my_float_var)" },
          { "comment": "# String type — Sequence of characters in quotes.", "code": " my_string_var = 'hello'" },
          { "comment": "# Print string value.", "code": " print('String:', my_string_var)" },
          { "comment": "# Boolean type — True or False values.", "code": " my_boolean_var = True" },

          { "comment": "# Print dictionary value.", "code": " print('Dictionary:', my_dictionary_var)" },
          { "comment": "# Tuple type — Immutable ordered collection inside parentheses.", "code": " my_tuple_var = (7, 5, 8)" },
          { "comment": "# Print tuple value.", "code": " print('Tuple:', my_tuple_var)" },
          { "comment": "# Range type — Sequence of numbers, often used in loops.", "code": " my_range_var = range(5)" },
          { "comment": "# Print range value.", "code": " print('Range:', my_range_var)" },
          { "comment": "# List type — Ordered collection, supports mixed data types.", "code": " my_list = [22, 'Hello world', 3.14, True]" },
          { "comment": "# Print list value.", "code": " print('List:', my_list)" },
          { "comment": "# None type — Represents absence of a value.", "code": " my_none_var = None" },
          { "comment": "# Print None value.", "code": " print('None:', my_none_var)" },
          { "comment": "# type() function — Reveals the data type of a variable.", "code": " print(type(my_integer_var))" },
          { "comment": "# Example: <class 'int'> is shown in terminal.", "code": " print(type(my_float_var))" },
          { "comment": "# Example: <class 'str'> for strings.", "code": " print(type(my_string_var))" },
          { "comment": "# Example: <class 'bool'> for booleans.", "code": " print(type(my_boolean_var))" },
          { "comment": "# Example: <class 'set'> for sets.", "code": " print(type(my_set_var))" },
          { "comment": "# Example: <class 'dict'> for dictionaries.", "code": " print(type(my_dictionary_var))" },
          { "comment": "# Example: <class 'tuple'> for tuples.", "code": " print(type(my_tuple_var))" },
          { "comment": "# Example: <class 'range'> for ranges.", "code": " print(type(my_range_var))" },
          { "comment": "# Example: <class 'list'> for lists.", "code": " print(type(my_list))" },
          { "comment": "# Example: <class 'NoneType'> for None.", "code": " print(type(my_none_var))" },
          { "comment": "# isinstance() function — Checks if a variable matches a specific type.", "code": " print(isinstance('Hello world', str)) # True" },
          { "comment": "# isinstance() example with boolean.", "code": " print(isinstance(True, bool)) # True" },
          { "comment": "# isinstance() example with integer.", "code": " print(isinstance(42, int)) # True" },
          { "comment": "# isinstance() example with mismatched type.", "code": " print(isinstance('John Doe', int)) # False" },
          { "comment": "# Comparison note — Python is dynamically typed, unlike C++, Java, or C# which require explicit type declarations.", "code": " # Example in C++: string name = 'John Doe'; int age = 25;" },
          { "comment": "# Final note — Python determines types at runtime, so type errors appear only when the program executes.", "code": " # Compiled languages catch type errors earlier, during the compile step." }
        ]
      },
      {
        "title": "CHAPTER 1.4: Python Data Types Demonstrations",
        "steps": [
          { "comment": "# Function for whole number (integer).", "code": "def demonstrate_integer():" },
          { "comment": "# Integer — whole numbers without decimals.", "code": " my_integer = 100" },
          { "comment": "# Print integer value.", "code": " print('Integer value:', my_integer)" },
          { "comment": "# Show type of variable.", "code": " print('Type:', type(my_integer)) # <class 'int'>" },
          { "comment": "# Function for decimal (float).", "code": "def demonstrate_float():" },
          { "comment": "# Float — numbers with decimals.", "code": " my_float = 3.14159" },
          { "comment": "# Print float value.", "code": " print('Float value:', my_float)" },

          { "comment": "# Function for text data enclosed in quotes.", "code": "def demonstrate_text_quotes():" },

          { "comment": "# Print double quoted string.", "code": " print('Double quoted:', text_double)" },

          { "comment": "# Show type.", "code": " print('Type:', type(my_bool)) # <class 'bool'>" },

      {

      {

          { "comment": "# Accessing by index — my_str[0] returns the first character. my_str[6] returns the seventh character. Negative indices like -1 return the last character.", "code": "print(my_str[0]) # H\nprint(my_str[6]) # w\nprint(my_str[-1]) # d" },
          { "comment": "# Basic slicing syntax: string[start:stop]. The slice starts at 'start' and goes up to, but does not include, 'stop'.", "code": "print(my_str[1:4]) # ell" },

          { "comment": "# Omitting the stop index defaults to the end of the string. This extracts from the start index through the end.", "code": "print(my_str[8:]) # rld" },

          { "comment": "# Negative step with explicit start/stop — my_str[10:5:-1] starts at index 10 ('d'), moves backward one step at a time, and stops before index 5. Result: 'dlrow'.", "code": "print(my_str[10:5:-1]) # dlrow" },

    let currentChapter = 0;
    let currentStep = 0;
    const codeArea = document.getElementById('code-area');
    const commentBox = document.getElementById('comment-box');
    const hintArea = document.getElementById('hint-area');
    const codeInput = document.getElementById('code-input');
    const submitBtn = document.getElementById('submit-btn');
    const skipBtn = document.getElementById('skip-btn');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');
    const resetBtn = document.getElementById('reset');
    const chapterBtn = document.getElementById('chapter-btn');
    const chapterList = document.getElementById('chapter-list');

    function populateChapters() {
      chapterList.innerHTML = '';
      chapters.forEach((ch, idx) => {
        const item = document.createElement('div');
        item.classList.add('chapter-item');
        item.textContent = ch.title;
        item.onclick = () => selectChapter(idx);
        chapterList.appendChild(item);
      });
    }

    function selectChapter(idx) {
      currentChapter = idx;
      currentStep = 0;
      chapterList.classList.remove('show');
      resetChapter();
    }

    function resetChapter() {
      codeArea.innerHTML = '';
      commentBox.textContent = '';
      codeInput.value = '';
      hintArea.textContent = 'Type exactly:';
      nextBtn.disabled = true;
      // Fix: Re-enable input and buttons when starting a new chapter
      codeInput.disabled = false;
      submitBtn.disabled = false;
      skipBtn.disabled = false;
      loadStep();
    }

    function loadStep() {
      const step = chapters[currentChapter].steps[currentStep];
      if (step) {
        commentBox.textContent = step.comment;
        hintArea.textContent = `Type exactly: ${step.code || '(empty line - just press submit)'}`;
        codeInput.placeholder = step.code;
        codeInput.focus();
      } else {
        hintArea.textContent = 'Chapter complete!';
        codeInput.disabled = true;
        submitBtn.disabled = true;
        skipBtn.disabled = true;
        nextBtn.disabled = false;
      }
    }

    function addLine(code) {
      const line = document.createElement('div');
      line.classList.add('line', 'new');
      line.textContent = code;
      codeArea.appendChild(line);
      codeArea.scrollTop = codeArea.scrollHeight;
    }

    function shineLine() {
      const lines = codeArea.querySelectorAll('.line');
      if (lines.length > 0) {
        const lastLine = lines[lines.length - 1];
        lastLine.classList.add('line-shine');
        setTimeout(() => lastLine.classList.remove('line-shine'), 1800);
      }
    }

    submitBtn.onclick = () => {
      const input = codeInput.value.trim();
      const expected = chapters[currentChapter].steps[currentStep].code.trim();
      if (input === expected) {
        addLine(input);
        shineLine();
        currentStep++;
        codeInput.value = '';
        loadStep();
      } else {
        codeInput.classList.add('action-shine');
        setTimeout(() => codeInput.classList.remove('action-shine'), 1000);
      }
    };

    skipBtn.onclick = () => {
      const step = chapters[currentChapter].steps[currentStep];
      addLine(step.code);
      currentStep++;
      loadStep();
    };

    prevBtn.onclick = () => {
      if (currentChapter > 0) {
        currentChapter--;
        resetChapter();
      }
    };

    nextBtn.onclick = () => {
      if (currentChapter < chapters.length - 1) {
        currentChapter++;
        resetChapter();
      }
    };

    resetBtn.onclick = resetChapter;

    chapterBtn.onclick = () => {
      chapterList.classList.toggle('show');
    };

    populateChapters();
    resetChapter();
  </script>
